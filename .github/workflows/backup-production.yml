name: 本番 DB のバックアップ

# Supabase の無料プランには自動バックアップがないため、週 1 回 DB を書き出して Artifacts に保存する（90 日保持）。
on:
  schedule:
    - cron: "0 18 * * 0"
  workflow_dispatch:

jobs:
  backup:
    if: ${{ vars.SUPABASE_PROJECT_ID != '' }}
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # CLI のバージョンは pnpm-lock.yaml の supabase から決まる（手元と同じバージョンを使う）
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
      - run: supabase link --project-ref "${{ vars.SUPABASE_PROJECT_ID }}"
      - run: |
          mkdir -p backup
          supabase db dump --linked -f backup/schema.sql
          supabase db dump --linked --data-only -f backup/data.sql
          supabase db dump --linked --role-only -f backup/roles.sql
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: supabase-backup-${{ github.run_id }}
          path: backup/
          retention-days: 90
