name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Node.js と pnpm のバージョンは .mise.toml と package.json の packageManager から決まる
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec oxlint
      - run: pnpm exec oxfmt --check
      - run: pnpm run type
      - run: pnpm run test
      - run: pnpm run spell
      - run: pnpm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54421
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-dummy-key
