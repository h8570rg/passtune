name: 本番 DB へのマイグレーション

# main に supabase/migrations の変更が入ったら、本番の Supabase に適用する。
# リポジトリの Variables に SUPABASE_PROJECT_ID、Secrets に SUPABASE_ACCESS_TOKEN と SUPABASE_DB_PASSWORD を設定するまでは何もしない。
on:
  push:
    branches: [main]
    paths: ["supabase/migrations/**"]
  workflow_dispatch:

jobs:
  migrate:
    if: ${{ vars.SUPABASE_PROJECT_ID != '' }}
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # CLI のバージョンは pnpm-lock.yaml の supabase から決まる（手元と同じバージョンを使う）
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
      - run: supabase link --project-ref "${{ vars.SUPABASE_PROJECT_ID }}"
      - run: supabase db push --yes --remote
